[package]
name = "WireBox"
version = "0.1.0"
edition = "2024"

[lib]
name = "wirebox"
path = "src/lib.rs"

[[bin]]
name = "wirebox"
path = "src/main.rs"

[[bin]]
name = "wirebox-cli"
path = "src/bin/cli.rs"

[dependencies]
thiserror = "2"
dirs = "6"

# GUI (the `wirebox` binary). `pipewire`/`toml`/`serde` are still unused -
# kept here for the audio-integration and config-file phases that come
# after this one, so we're not re-adding them later.
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_1", "v1_2", "v1_3", "v1_4", "v1_5"] }
gtk = { version = "0.11.4", package = "gtk4" }
pipewire = "0.10.1"
toml = "0.9"
serde = { version = "1", features = ["derive"] }
